# Replace __ONION_HOST__ with the generated v3 hostname and __WEB_PORT__ with
# the loopback web port. No other site API is reachable through this listener.
server {
    listen 127.0.0.1:19080;
    server_name __ONION_HOST__;
    if ($host != __ONION_HOST__) { return 444; }
    access_log off;
    error_log /dev/null;
    server_tokens off;
    client_max_body_size 96000;
    client_body_buffer_size 96k;
    client_body_timeout 10s;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";
    proxy_set_header Cookie "";
    proxy_hide_header Strict-Transport-Security;
    location = / { return 302 /secure-chat; }
    location = /api/secure-chat {
        limit_req zone=disroot_chat burst=120 nodelay;
        limit_req_status 429;
        proxy_connect_timeout 2s;
        proxy_read_timeout 25s;
        proxy_send_timeout 15s;
        proxy_pass http://127.0.0.1:__WEB_PORT__;
    }
    location = /secure-chat { proxy_pass http://127.0.0.1:__WEB_PORT__; }
    location ^~ /secure-chat/ { proxy_pass http://127.0.0.1:__WEB_PORT__; }
    location ^~ /_next/static/ { proxy_pass http://127.0.0.1:__WEB_PORT__; }
    location ~ ^/(favicon\.(svg|ico)|favicon-32\.png|icon-(192|512)\.png|apple-touch-icon\.png|images/mobile-terminal-bg-lain\.webp)$ {
        proxy_pass http://127.0.0.1:__WEB_PORT__;
    }
    location / { return 404; }
}
