# Include inside the HTTPS server. Define the zone in the nginx http context:
# limit_req_zone $server_name zone=disroot_chat:1m rate=60r/s;
# Disable access_log for this site's HTTP/HTTPS servers. Canonical origin is
# https://disroot.website; redirect www to it before serving the application.
location = /api/secure-chat {
    access_log off;
    error_log /dev/null;
    limit_req zone=disroot_chat burst=120 nodelay;
    limit_req_status 429;
    client_max_body_size 96000;
    client_body_buffer_size 96k;
    client_body_timeout 10s;
    proxy_request_buffering on;
    proxy_buffering off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 25s;
    proxy_send_timeout 15s;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";
    proxy_set_header Cookie "";
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store, private" always;
    add_header X-Content-Type-Options nosniff always;
}
